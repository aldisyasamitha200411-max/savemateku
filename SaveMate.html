<style>
/* Layout: kolom aplikasi ala ponsel (maks 480px), header atas, konten bergulir, navigasi bawah dengan tombol + di tengah. */
:root{
  --bg:#F5F1FE; --bg2:#E8E0FA; --surface:#FFFFFF; --surface2:#EEE8FC;
  --ink:#2A1A5E; --muted:#675C8F; --accent:#6A4DBA; --on-accent:#FFFFFF;
  --line:#DCD2F4; --good:#1B7F55; --bad:#B93A55; --gold:#F4B63A;
  --in:#6A4DBA; --out:#D9860F; --shadow:0 6px 18px rgba(74,50,150,.12);
  --f-display:'Baloo 2','Nunito',system-ui,sans-serif;
  --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17112E; --bg2:#0F0A22; --surface:#221A42; --surface2:#2D2454;
    --ink:#EFEAFF; --muted:#B0A6D6; --accent:#7F63DE; --on-accent:#FFFFFF;
    --line:#3A2F66; --good:#4CC794; --bad:#FF8AA3; --gold:#F4B63A;
    --in:#9C84F0; --out:#F2B04A; --shadow:0 6px 18px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17112E; --bg2:#0F0A22; --surface:#221A42; --surface2:#2D2454;
  --ink:#EFEAFF; --muted:#B0A6D6; --accent:#7F63DE; --on-accent:#FFFFFF;
  --line:#3A2F66; --good:#4CC794; --bad:#FF8AA3; --gold:#F4B63A;
  --in:#9C84F0; --out:#F2B04A; --shadow:0 6px 18px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg2);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));box-shadow:0 0 0 1px var(--line)}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{display:flex;align-items:center;gap:8px;font:800 24px var(--f-display);color:var(--accent);flex:1;min-width:0}
.top h1{font-size:22px;flex:1;min-width:0}
.ico{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.iconbtn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);position:relative;color:var(--accent)}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font:800 11px/18px var(--f-body);text-align:center;padding:0 4px}
:root[data-theme="dark"] .badge{color:#2A0A14}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .badge{color:#2A0A14}}
.screen{display:flex;flex-direction:column;gap:16px;padding-block:4px 8px}
.hello{background:var(--surface2);border-radius:20px;padding:16px;display:flex;align-items:center;gap:12px}
.hello h2{font-size:22px}
.hello p{color:var(--muted);font-size:14px}
.hello .mascot{width:64px;height:64px;flex:none;margin-left:auto}
.balance{background:var(--accent);color:var(--on-accent);border-radius:20px;padding:16px;display:flex;align-items:center;gap:14px;width:100%;text-align:left;box-shadow:var(--shadow)}
.balance small{display:block;opacity:.88;font-size:13px;font-weight:700}
.balance b{display:block;font:800 30px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.balance .sub{display:flex;gap:12px;margin-top:6px;font-size:12.5px;opacity:.92;font-weight:700;flex-wrap:wrap}
.coin{width:46px;height:46px;border-radius:50%;background:var(--gold);display:grid;place-items:center;color:#4A3200;flex:none}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:12.5px;text-align:center;line-height:1.2;color:var(--ink)}
.tile .ico{color:var(--accent);width:30px;height:30px}
.tile:active,.row-link:active,.btn:active{transform:scale(.98)}
h3.sec{font-size:17px;display:flex;align-items:center;justify-content:space-between;gap:8px}
h3.sec button{font:700 13px var(--f-body);color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.item .grow{flex:1;min-width:0}
.item b{display:block;overflow-wrap:anywhere}
.item small{color:var(--muted);font-size:12.5px;display:block}
.chip-ico{width:40px;height:40px;border-radius:12px;background:var(--surface2);color:var(--accent);display:grid;place-items:center;flex:none}
.amt{font:800 15px var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.in{color:var(--good)} .amt.out{color:var(--bad)}
.del{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.del:hover{background:var(--surface2);color:var(--bad)}
.btn{background:var(--accent);color:var(--on-accent);border-radius:14px;padding:11px 16px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.danger{background:var(--bad);color:#fff}
:root[data-theme="dark"] .btn.danger{color:#2A0A14}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.danger{color:#2A0A14}}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1;min-width:130px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.stat small{color:var(--muted);font-weight:700;font-size:12.5px}
.stat b{display:block;font:800 18px var(--f-display);font-variant-numeric:tabular-nums}
.stat.in b{color:var(--good)} .stat.out b{color:var(--bad)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.pill{padding:7px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:13.5px}
.pill[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:22px 12px;border:1.5px dashed var(--line);border-radius:18px}
.empty b{display:block;color:var(--ink);font:700 16px var(--f-display);margin-bottom:2px}
.note{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:14px;padding:10px 12px;font-size:13px;color:var(--muted)}
.note .btn{padding:6px 12px;min-height:34px;font-size:13px;margin-left:auto;flex:none}
.tag{display:inline-block;font-size:11.5px;font-weight:800;padding:2px 9px;border-radius:999px;background:var(--surface2);color:var(--accent)}
.tag.warn{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.tag.ok{background:transparent;color:var(--good);border:1px solid var(--good)}
.check{width:28px;height:28px;border-radius:9px;border:2px solid var(--accent);display:grid;place-items:center;flex:none;color:var(--on-accent)}
.check[aria-checked="true"]{background:var(--accent)}
.check .ico{width:18px;height:18px;opacity:0}
.check[aria-checked="true"] .ico{opacity:1}
.done .grow b{text-decoration:line-through;color:var(--muted)}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-head h3{font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal .dow{font-size:11.5px;font-weight:800;color:var(--muted);padding:4px 0}
.day{aspect-ratio:1;max-height:48px;border-radius:12px;font-weight:700;font-size:14px;position:relative;display:grid;place-items:center;background:var(--surface);border:1px solid transparent}
.day.today{border-color:var(--accent)}
.day.sel{background:var(--accent);color:var(--on-accent)}
.day.has::after{content:"";position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--gold)}
.calbox{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px}
.bars{width:100%;height:auto;display:block}
.bars text{fill:var(--muted);font:700 10px var(--f-body)}
.bars .val{fill:var(--ink);font-size:9px}
.bars .b-in{fill:var(--in)} .bars .b-out{fill:var(--out)} .bars .grid-l{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:14px;font-size:12.5px;font-weight:700;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.meter{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;margin-top:6px}
.meter span{display:block;height:100%;background:var(--out);border-radius:4px}
.row-link{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;width:100%;text-align:left;font-weight:800}
.row-link .grow{flex:1;min-width:0}
.row-link small{display:block;color:var(--muted);font-weight:600}
.profile{display:flex;align-items:center;gap:14px}
.avatar{width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:800 28px var(--f-display);flex:none}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px}
dt{color:var(--muted);font-weight:700}
dd{margin:0;font-weight:700;overflow-wrap:anywhere;text-align:right}
.slogan{text-align:center;font:700 15px var(--f-display);color:var(--accent);padding:6px 0 0}
/* nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:8px max(8px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px));z-index:6}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--muted);padding:4px 0;position:relative}
.nav button[aria-current="page"]{color:var(--accent)}
.nav .fab{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--on-accent);margin:-30px auto 0;display:grid;place-items:center;box-shadow:var(--shadow);border:4px solid var(--surface);padding:0}
.nav .fab .ico{width:28px;height:28px}
.nav .badge{top:-2px;right:calc(50% - 22px)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,10,50,.5);z-index:20}
.panel{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);max-height:90vh;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;z-index:21;display:flex;flex-direction:column;gap:12px;padding-block:12px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translate(-50%,24px);opacity:.4}to{transform:translate(-50%,0);opacity:1}}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 2px}
.panel h2{font-size:20px}
.f{display:flex;flex-direction:column;gap:4px}
.f>span{font-weight:800;font-size:13px;color:var(--muted)}
.f input,.f select,.f textarea{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;width:100%}
.f textarea{min-height:84px;resize:vertical}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface2);padding:4px;border-radius:14px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0}
.seg span{display:block;text-align:center;padding:9px 6px;border-radius:11px;font-weight:800}
.seg input:checked+span{background:var(--accent);color:var(--on-accent)}
.seg input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.panel .row{display:flex;gap:8px}
.panel .row .btn{flex:1}
.err{color:var(--bad);font-weight:700;min-height:0}
.err:empty{display:none}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:30;max-width:90%}
@media (prefers-reduced-motion:reduce){.panel{animation:none}*{transition:none!important}}
</style>

/* ---------- derived ---------- */
function totals(list){var i=0,o=0;list.forEach(function(t){if(t.type==='in')i+=t.amount;else o+=t.amount});return {i:i,o:o}}
function balance(){var t=totals(S.tx);return t.i-t.o}
function monthKey(s){return s.slice(0,7)}
function notifs(){
  var out=[];
  S.events.forEach(function(e){var d=diffDays(e.date);if(d>=0&&d<=7)out.push({i:'calendar',t:e.title,s:(d===0?'Hari ini':d===1?'Besok':d+' hari lagi')+' · '+fmt(e.date,{weekday:'long',day:'numeric',month:'long'}),k:d})});
  S.todos.forEach(function(t){if(t.done)return;var d=diffDays(t.due);if(d<=3)out.push({i:'check',t:t.text,s:d<0?'Terlambat '+(-d)+' hari':d===0?'Tenggat hari ini':'Tenggat '+d+' hari lagi',k:d})});
  S.notes.forEach(function(n){if(n.pin)out.push({i:'megaphone',t:n.title,s:'Pengumuman disematkan',k:50})});
  var unpaid=S.members.filter(function(m){return !m.paid}).length;
  if(unpaid)out.push({i:'users',t:unpaid+' anggota belum bayar kas',s:'Iuran '+rp(S.kas)+' per anggota',k:60});
  return out.sort(function(a,b){return a.k-b.k});
}

function vKalender(){
  var c=ui.cal,first=new Date(c.y,c.m,1),start=(first.getDay()+6)%7,dim=new Date(c.y,c.m+1,0).getDate();
  var has={};S.events.forEach(function(e){has[e.date]=1});
  var cells=['Sen','Sel','Rab','Kam','Jum','Sab','Min'].map(function(d){return '<span class="dow">'+d+'</span>'}).join('');
  for(var i=0;i<start;i++)cells+='<span></span>';
  for(var d=1;d<=dim;d++){var ds=c.y+'-'+pad(c.m+1)+'-'+pad(d);cells+='<button class="day'+(ds===today()?' today':'')+(ds===c.sel?' sel':'')+(has[ds]?' has':'')+'" data-act="selday" data-v="'+ds+'" aria-label="'+fmt(ds,{day:'numeric',month:'long'})+(has[ds]?', ada agenda':'')+'">'+d+'</button>'}
  var dayEv=S.events.filter(function(e){return e.date===c.sel});
  var upcoming=S.events.filter(function(e){var d=diffDays(e.date);return d>=0&&e.date!==c.sel}).sort(function(a,b){return a.date.localeCompare(b.date)}).slice(0,6);
  var evHtml=function(e){return '<li class="item"><span class="chip-ico">'+ic('calendar')+'</span><span class="grow"><b>'+esc(e.title)+'</b><small>'+fmt(e.date,{weekday:'long',day:'numeric',month:'long'})+' · <span class="tag">'+esc(e.type)+'</span></small></span><button class="del" data-act="delev" data-id="'+e.id+'" aria-label="Hapus agenda">'+ic('trash')+'</button></li>'};

  (dayEv.length?'<ul class="list">'+dayEv.map(evHtml).join('')+'</ul>':emptyBox('Tidak ada agenda','Pilih tanggal lain atau tambah agenda baru.'))+
  (upcoming.length?'<h3 class="sec">Akan datang</h3><ul class="list">'+upcoming.map(evHtml).join('')+'</ul>':'');
}

function vLaporan(){
  var months=[],d=new Date();d.setDate(1);
  for(var i=5;i>=0;i--){var x=new Date(d.getFullYear(),d.getMonth()-i,1);months.push({k:x.getFullYear()+'-'+pad(x.getMonth()+1),l:x.toLocaleDateString('id-ID',{month:'short'})})}
  months.forEach(function(m){var t=totals(S.tx.filter(function(x){return monthKey(x.date)===m.k}));m.i=t.i;m.o=t.o});
  var max=Math.max.apply(null,months.map(function(m){return Math.max(m.i,m.o)}).concat([1]));
  var W=360,H=210,L=8,B=28,T=22,ch=H-B-T,gw=(W-L*2)/months.length,bw=Math.min(20,gw/2-6),svg='';
  for(var g=0;g<=2;g++){var y=T+ch-ch*g/2;svg+='<line class="grid-l" x1="'+L+'" x2="'+(W-L)+'" y1="'+y+'" y2="'+y+'"/>'}
  months.forEach(function(m,idx){
    var cx=L+gw*idx+gw/2,hi=ch*m.i/max,ho=ch*m.o/max;
    svg+='<rect class="b-in" x="'+(cx-bw-1)+'" y="'+(T+ch-hi)+'" width="'+bw+'" height="'+hi+'" rx="4"/><rect class="b-out" x="'+(cx+1)+'" y="'+(T+ch-ho)+'" width="'+bw+'" height="'+ho+'" rx="4"/>';
    if(m.i)svg+='<text class="val" x="'+(cx-bw/2-1)+'" y="'+(T+ch-hi-4)+'" text-anchor="middle">'+short(m.i)+'</text>';
    if(m.o)svg+='<text class="val" x="'+(cx+bw/2+1)+'" y="'+(T+ch-ho-4)+'" text-anchor="middle">'+short(m.o)+'</text>';
    svg+='<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle">'+m.l+'</text>';
  });
  var any=months.some(function(m){return m.i||m.o});
  var cats={};S.tx.filter(function(t){return t.type==='out'}).forEach(function(t){cats[t.cat]=(cats[t.cat]||0)+t.amount});
  var cl=Object.keys(cats).map(function(k){return [k,cats[k]]}).sort(function(a,b){return b[1]-a[1]});
  var tot=totals(S.tx);
  return '<div class="stats"><div class="stat in"><small>Total pemasukan</small><b>'+rp(tot.i)+'</b></div><div class="stat out"><small>Total pengeluaran</small><b>'+rp(tot.o)+'</b></div></div>'+
  '<div class="card"><h3 style="margin-bottom:8px">6 bulan terakhir</h3>'+(any?'<svg class="bars" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Grafik batang pemasukan dan pengeluaran per bulan">'+svg+'</svg><div class="legend"><span><i style="background:var(--in)"></i>Pemasukan</span><span><i style="background:var(--out)"></i>Pengeluaran</span></div>':emptyBox('Belum ada data','Catat transaksi agar grafik muncul.'))+'</div>'+
  '<div class="card"><h3 style="margin-bottom:8px">Pengeluaran per kategori</h3>'+(cl.length?cl.map(function(c){return '<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;gap:8px;font-weight:700"><span>'+esc(c[0])+'</span><span class="amt">'+rp(c[1])+'</span></div><div class="meter"><span style="width:'+Math.round(c[1]/tot.o*100)+'%"></span></div></div>'}).join(''):'<p style="color:var(--muted)">Belum ada pengeluaran.</p>')+'</div>';
}

  app.innerHTML=header()+'<main class="screen pad">'+(VIEWS[ui.view]||vHome)()+'</main>'+nav();
  if(keep&&keep!=='set-theme'){var el=document.getElementById(keep);if(el){el.focus();try{el.setSelectionRange(el.value.length,el.value.length)}catch(e){}}}
}
function go(v){ui.view=v;ui.confirm=null;render();window.scrollTo(0,0)}

/* ---------- sheets ---------- */
var handler=null;
function fld(id,label,val,type,attrs){return '<label class="f" for="f-'+id+'"><span>'+label+'</span><input id="f-'+id+'" name="'+id+'" type="'+(type||'text')+'" value="'+esc(val||'')+'" '+(attrs||'')+'></label>'}
function sel(id,label,opts,cur){return '<label class="f" for="f-'+id+'"><span>'+label+'</span><select id="f-'+id+'" name="'+id+'">'+opts.map(function(o){return '<option'+(o===cur?' selected':'')+'>'+o+'</option>'}).join('')+'</select></label>'}
function openSheet(title,body,label,fn){
  handler=fn;
  sheet.innerHTML='<div class="scrim" data-act="close"></div><form class="panel" id="sf" novalidate aria-label="'+esc(title)+'"><div class="grab"></div><h2>'+title+'</h2>'+body+'<p class="err" id="sferr" role="alert"></p><div class="row"><button type="button" class="btn ghost" data-act="close">Batal</button><button class="btn" type="submit">'+label+'</button></div></form>';
  sheet.hidden=false;
  setTimeout(function(){var f=sheet.querySelector('input:not([type=radio]),textarea,select');if(f)f.focus()},40);
}
function closeSheet(){sheet.hidden=true;sheet.innerHTML='';handler=null}
sheet.addEventListener('submit',function(e){
  e.preventDefault();
  var r=handler&&handler(new FormData(e.target));
  if(r){$('#sferr').textContent=r;return}
  closeSheet();
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!sheet.hidden)closeSheet()});
var num=function(v){return parseInt(String(v||'').replace(/\D/g,''),10)||0};

function txSheet(type){
  var cats=['Kas','Iuran','Perlengkapan','Kegiatan','Lainnya'];
  openSheet('Catat transaksi',
   '<div class="seg" role="radiogroup" aria-label="Jenis transaksi"><label><input type="radio" name="type" value="in"'+(type!=='out'?' checked':'')+'><span>Pemasukan</span></label><label><input type="radio" name="type" value="out"'+(type==='out'?' checked':'')+'><span>Pengeluaran</span></label></div>'+
   fld('title','Keterangan','','text','maxlength="60" placeholder="mis. Kas minggu ke-3"')+fld('amount','Jumlah (Rp)','','text','inputmode="numeric" placeholder="50000"')+fld('date','Tanggal',today(),'date')+sel('cat','Kategori',cats,'Kas'),
   'Simpan',function(fd){
    var title=String(fd.get('title')||'').trim(),amount=num(fd.get('amount')),date=fd.get('date');
    if(!title)return 'Isi keterangan transaksi.';
    if(amount<=0)return 'Jumlah harus lebih dari nol.';
    if(!date)return 'Pilih tanggal.';
    var ty=fd.get('type')==='out'?'out':'in';
    S.tx.push({id:uid(),type:ty,title:title,amount:amount,date:date,cat:fd.get('cat')});
    addLog((ty==='in'?'Pemasukan ':'Pengeluaran ')+rp(amount)+': '+title);
    save();toast('Transaksi disimpan');
   });
}
function evSheet(){
  openSheet('Tambah agenda',fld('title','Nama agenda','','text','maxlength="60"')+fld('date','Tanggal',ui.cal.sel,'date')+sel('type','Jenis',['Kegiatan','Ulangan','Ulang tahun','Lainnya'],'Kegiatan'),'Simpan',function(fd){
    var t=String(fd.get('title')||'').trim();if(!t)return 'Isi nama agenda.';if(!fd.get('date'))return 'Pilih tanggal.';
    S.events.push({id:uid(),title:t,date:fd.get('date'),type:fd.get('type')});ui.cal.sel=fd.get('date');
    var p=fd.get('date').split('-');ui.cal.y=+p[0];ui.cal.m=+p[1]-1;
    addLog('Agenda ditambah: '+t);save();toast('Agenda disimpan');
  });
}
function todoSheet(){
  openSheet('Tambah tugas',fld('text','Tugas atau PR','','text','maxlength="80"')+fld('due','Tenggat',addDays(1),'date'),'Simpan',function(fd){
    var t=String(fd.get('text')||'').trim();if(!t)return 'Isi nama tugas.';if(!fd.get('due'))return 'Pilih tenggat.';
    S.todos.push({id:uid(),text:t,due:fd.get('due'),done:false});addLog('Tugas ditambah: '+t);save();toast('Tugas disimpan');
  });
}
function noteSheet(){
  openSheet('Buat pengumuman',fld('title','Judul','','text','maxlength="60"')+'<label class="f" for="f-body"><span>Isi pengumuman</span><textarea id="f-body" name="body" maxlength="400"></textarea></label>'+'<label class="f" style="flex-direction:row;align-items:center;gap:10px"><input type="checkbox" name="pin" style="width:22px;min-height:22px"><span>Sematkan di atas</span></label>','Terbitkan',function(fd){
    var t=String(fd.get('title')||'').trim(),b=String(fd.get('body')||'').trim();if(!t)return 'Isi judul pengumuman.';if(!b)return 'Isi pengumuman tidak boleh kosong.';
    S.notes.push({id:uid(),title:t,body:b,date:today(),pin:!!fd.get('pin')});addLog('Pengumuman diterbitkan: '+t);save();toast('Pengumuman terbit');
  });
}
function memberSheet(){
  openSheet('Tambah anggota',fld('name','Nama','','text','maxlength="40"')+fld('role','Jabatan (opsional)','','text','maxlength="30" placeholder="mis. Sekretaris"'),'Simpan',function(fd){
    var n=String(fd.get('name')||'').trim();if(!n)return 'Isi nama anggota.';
    S.members.push({id:uid(),name:n,role:String(fd.get('role')||'').trim(),paid:false});addLog('Anggota ditambah: '+n);save();toast('Anggota ditambah');
  });
}
function clsSheet(){
  openSheet('Ubah profil kelas',fld('name','Nama kelas',S.cls.name,'text','maxlength="30"')+fld('school','Sekolah',S.cls.school,'text','maxlength="50"')+fld('wali','Wali kelas',S.cls.wali,'text','maxlength="40"')+fld('year','Tahun ajaran',S.cls.year,'text','maxlength="15"'),'Simpan',function(fd){
    var n=String(fd.get('name')||'').trim();if(!n)return 'Nama kelas tidak boleh kosong.';
    S.cls={name:n,school:String(fd.get('school')||'').trim(),wali:String(fd.get('wali')||'').trim(),year:String(fd.get('year')||'').trim()};addLog('Profil kelas diperbarui');save();toast('Profil disimpan');
  });
}

/* ---------- actions ---------- */
function byId(list,id){return list.filter(function(x){return x.id===id})[0]}
function del(key,id,msg){S[key]=S[key].filter(function(x){return x.id!==id});addLog(msg);save();toast('Dihapus')}
var ACT={
  go:function(el){go(el.dataset.v)},
  back:function(){go(PARENT[ui.view]||'home')},
  close:closeSheet,
  addtx:function(el){txSheet(el.dataset.v||'in')},
  filter:function(el){ui.filter=el.dataset.v;render()},
  deltx:function(el){var t=byId(S.tx,el.dataset.id);del('tx',el.dataset.id,'Transaksi dihapus: '+(t?t.title:''))},
  selday:function(el){ui.cal.sel=el.dataset.v;render()},
  calnav:function(el){var d=new Date(ui.cal.y,ui.cal.m+ +el.dataset.v,1);ui.cal.y=d.getFullYear();ui.cal.m=d.getMonth();render()},
  addev:evSheet,
  delev:function(el){var e=byId(S.events,el.dataset.id);del('events',el.dataset.id,'Agenda dihapus: '+(e?e.title:''))},
  addtodo:todoSheet,
  toggle:function(el){var t=byId(S.todos,el.dataset.id);t.done=!t.done;addLog((t.done?'Tugas selesai: ':'Tugas dibuka lagi: ')+t.text);save()},
  deltodo:function(el){var t=byId(S.todos,el.dataset.id);del('todos',el.dataset.id,'Tugas dihapus: '+(t?t.text:''))},
  addnote:noteSheet,
  pin:function(el){var n=byId(S.notes,el.dataset.id);n.pin=!n.pin;save()},
  delnote:function(el){var n=byId(S.notes,el.dataset.id);del('notes',el.dataset.id,'Pengumuman dihapus: '+(n?n.title:''))},
  editcls:clsSheet,
  addmember:memberSheet,
  delmember:function(el){var m=byId(S.members,el.dataset.id);del('members',el.dataset.id,'Anggota dihapus: '+(m?m.name:''))},
  pay:function(el){
    var m=byId(S.members,el.dataset.id);m.paid=!m.paid;
    if(m.paid){S.tx.push({id:uid(),type:'in',title:'Kas '+m.name,amount:S.kas,date:today(),cat:'Kas',ref:m.id});addLog(m.name+' membayar kas '+rp(S.kas))}
    else{S.tx=S.tx.filter(function(t){return t.ref!==m.id});addLog('Pembayaran kas '+m.name+' dibatalkan')}
    save();
  },
  newperiod:function(){S.members.forEach(function(m){m.paid=false});S.tx.forEach(function(t){delete t.ref});addLog('Periode iuran baru dimulai');save();toast('Periode baru dimulai')},
  ask:function(el){ui.confirm=el.dataset.v;render()},
  clear:function(){S=empty();ui.confirm=null;applyTheme();save();toast('Data dikosongkan');if(ui.view==='pengaturan')return;},
  demo:function(){var th=S.theme;S=seed();S.theme=th;ui.confirm=null;save();toast('Data contoh dipulihkan')}
};
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act;
  if(a==='theme'||a==='kas'||a==='uname')return;
  if(ACT[a]){e.preventDefault();ACT[a](el)}
});
document.addEventListener('change',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  if(el.dataset.act==='theme'){S.theme=el.value;applyTheme();save()}
  else if(el.dataset.act==='kas'){var v=num(el.value);if(v>0){S.kas=v;save();toast('Iuran kas disimpan')}else{el.value=S.kas}}
  else if(el.dataset.act==='uname'){var n=el.value.trim();if(n){S.user.name=n.slice(0,30);save();toast('Nama disimpan')}else{el.value=S.user.name}}
});

applyTheme();
render();
})();
</script>

</body></html>
